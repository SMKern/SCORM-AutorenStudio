<!DOCTYPE html>
<!--
╔══════════════════════════════════════════════════════════════════════════════╗
║  LAYOUT-DATEI für das SCORM-AutorenStudio                                    ║
║  Layout: „Kompakt (hell)“ – Beispiel für ein anders aufgebautes Layout       ║
╚══════════════════════════════════════════════════════════════════════════════╝

  Helles, schlichtes Layout: schmales Kopfbild, Titel darunter, Schritte als
  Reiter oben, Bild über dem Text, unten „Zurück · Schritt 2 von 4 · Weiter“.
  Farbe: Petrol #0f766e.

  Es dient als Muster: So kann ein ganz anderer Aufbau aussehen. Regeln und
  Platzhalter: LAYOUT-FORMAT.md im selben Ordner.
-->
<html lang="de">
<head>
<meta charset="utf-8">
<title>Layout: Kompakt (hell)</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 16px; color: #1e293b; line-height: 1.5; }
  h1 { color: #0f766e; }
</style>
</head>
<body>
<h1>Layout „Kompakt (hell)“</h1>
<p>Dies ist eine <b>Layout-Datei für das SCORM-AutorenStudio</b>. Sie wird im SCORM-AutorenStudio unter <b>🎨 Layout → Layout-Datei laden</b> eingelesen.</p>

<script type="application/json" id="layout-info">
{
  "format": "kurs-layout-1",
  "id": "kompakt-hell",
  "name": "Kompakt (hell)",
  "version": "1.0",
  "beschreibung": "Helles, schlichtes Layout: schmales Kopfbild, Schritte als Reiter oben, Bild über dem Text, Zähler „Schritt 2 von 4“. Farbe Petrol #0f766e.",
  "farben": { "akzent": "#0f766e", "hell": "#ecfdf5", "text": "#334155", "linie": "#e2e8f0" },
  "stile": {
    "ueberschrift": "font-family:Arial,sans-serif;font-size:18px;line-height:1.3;font-weight:700;color:#0f766e;margin:16px 0 8px;",
    "infokasten": "border:1px solid #e2e8f0;border-radius:10px;background:#f8fafc;padding:12px 16px;margin:14px 0;",
    "merke": "border-left:4px solid #0f766e;background:#ecfdf5;border-radius:6px;padding:12px 16px;margin:14px 0;",
    "bild": "display:block;width:100%;max-width:640px;height:auto;border-radius:8px;margin:12px 0;",
    "video": "display:block;width:100%;max-width:640px;height:auto;border-radius:8px;background:#000;margin:12px 0;",
    "iframe": "display:block;width:100%;max-width:640px;aspect-ratio:16/9;border:0;border-radius:8px;margin:12px 0;",
    "ul": "margin:8px 0 12px;padding-left:0;list-style:none;",
    "li": "position:relative;padding-left:22px;margin:6px 0;line-height:1.5;",
    "listenpunkt": "<span aria-hidden=\"true\" style=\"position:absolute;left:4px;top:8px;width:8px;height:8px;border-radius:2px;background:#0f766e;\"></span><span data-lm-li>{{{inhalt}}}</span>",
    "ol": "margin:8px 0 12px;padding-left:24px;line-height:1.5;",
    "tabelle": "border-collapse:collapse;width:100%;margin:12px 0;font-size:14px;",
    "zelle": "border-bottom:1px solid #e2e8f0;padding:8px 10px;text-align:left;vertical-align:top;",
    "kopfzelle": "border-bottom:2px solid #0f766e;padding:8px 10px;text-align:left;vertical-align:top;font-weight:700;color:#0f766e;",
    "link": "color:#0f766e;font-weight:700;text-decoration:underline;",
    "mediumBild": "display:block;width:100%;max-height:420px;object-fit:contain;background:#f1f5f9;border-radius:10px;",
    "mediumVideo": "display:block;width:100%;max-height:420px;background:#000;border-radius:10px;"
  }
}
</script>

<script type="text/x-vorlage" data-name="seite">
<!--
================================================================================
  {{modulNr}}.{{teilNr}}  {{titel}}
  Kurs: {{kursTitel}} · Modul {{modulNr}} │ {{modulTitel}}
  Datei: {{datei}}
================================================================================
  Seite im Layout „Kompakt (hell)“, erstellt mit dem SCORM-AutorenStudio.
  Aufbau: ① Kopf (Bild, Modul, Titel) · ② Reiter · ③ Schritte · ④ Fußleiste
  ✔ Texte zwischen > und < darfst du ändern.
  ✘ onclick="…" und data-…-Angaben nicht ändern.
================================================================================
-->
<div data-lm-layout="kompakt-hell" data-lm-kopfbild="{{kopfbild}}" data-lm-icon="{{icon}}" data-current="1" style="font-family:Arial,sans-serif;font-size:16px;line-height:1.55;color:#1e293b;max-width:1100px;margin:0 auto;background:#ffffff;border:1px solid #e2e8f0;border-radius:16px;overflow:hidden;box-sizing:border-box;">

<!-- ① KOPF -->
{{#kopfbild}}<div style="height:170px;background:#0f766e url('{{kopfbild}}') center center / cover no-repeat;"></div>
{{/kopfbild}}<div style="padding:22px 28px 6px;border-top:5px solid #0f766e;">
<div style="font-size:13px;font-weight:700;letter-spacing:.5px;color:#0f766e;">MODUL {{modulNr}} · <span data-lm="modul-titel">{{modulTitel}}</span></div>
<h1 data-lm="titel" style="font-family:Arial,sans-serif;font-size:28px;line-height:1.2;margin:6px 0 8px;color:#0f172a;">{{titel}}</h1>
<p data-lm="einleitung" style="margin:0;color:#475569;">{{einleitung}}</p>
</div>

<!-- ② REITER (einer pro Schritt) -->
<div style="display:{{#einSchritt}}none{{/einSchritt}}{{^einSchritt}}flex{{/einSchritt}};flex-wrap:wrap;gap:4px;padding:14px 28px 0;border-bottom:1px solid #e2e8f0;">
{{#schritte}}{{> reiter}}
{{/schritte}}</div>

<!-- ③ SCHRITTE -->
<div style="padding:22px 28px 10px;">
{{#schritte}}{{> schritt}}
{{/schritte}}</div>

<!-- ④ FUSSLEISTE{{#einSchritt}} (bei nur einem Schritt ausgeblendet){{/einSchritt}} -->
<div style="display:{{#einSchritt}}none{{/einSchritt}}{{^einSchritt}}flex{{/einSchritt}};align-items:center;justify-content:space-between;gap:12px;padding:14px 28px 22px;border-top:1px solid #e2e8f0;">
<button type="button" data-go="back" onclick="{{> blaettern}}" style="font-family:Arial,sans-serif;font-weight:700;font-size:15px;color:#0f766e;background:#ffffff;border:2px solid #0f766e;border-radius:8px;padding:10px 18px;cursor:pointer;visibility:hidden;">← Zurück</button>
<span data-zaehler="1" style="color:#64748b;font-size:14px;">Schritt 1 von {{anzahl}}</span>
<button type="button" data-go="next" onclick="{{> blaettern}}" style="font-family:Arial,sans-serif;font-weight:700;font-size:15px;color:#ffffff;background:#0f766e;border:2px solid #0f766e;border-radius:8px;padding:10px 18px;cursor:pointer;">Weiter →</button>
</div>
</div>
</script>

<script type="text/x-vorlage" data-name="reiter">
<button type="button" data-go="{{nr}}" data-step="{{nr}}" onclick="{{> blaettern}}" style="font-family:Arial,sans-serif;font-size:14px;font-weight:700;background:transparent;border:0;border-bottom:3px solid {{#erster}}#0f766e{{/erster}}{{^erster}}transparent{{/erster}};color:{{#erster}}#0f766e{{/erster}}{{^erster}}#475569{{/erster}};padding:8px 12px;cursor:pointer;">{{nr}}. {{titel}}</button>
</script>

<script type="text/x-vorlage" data-name="schritt">
<!-- ══ SCHRITT {{nr}}: {{titel}} ══ -->
<div data-panel="{{nr}}" style="display:{{#erster}}block{{/erster}}{{^erster}}none{{/erster}};">
<div style="display:flex;align-items:center;gap:12px;margin:0 0 12px;">
{{#icon}}<img src="{{icon}}" alt="" aria-hidden="true" style="width:40px;height:40px;object-fit:contain;border-radius:8px;background:#ecfdf5;">{{/icon}}
<h2 data-lm="schritt-titel" style="font-family:Arial,sans-serif;font-size:22px;line-height:1.25;margin:0;color:#0f172a;">{{titel}}</h2>
</div>
{{#hatMedium}}<div data-lm="medium" style="max-width:720px;margin:0 0 16px;">
{{{medium}}}
</div>
{{/hatMedium}}<div data-lm="text" style="color:#334155;font-size:16px;line-height:1.6;max-width:820px;">
{{{text}}}
</div>
</div>
</script>

<script type="text/x-vorlage" data-name="blaettern">
var r=this.closest('[data-lm-layout]');var t=r.querySelectorAll('[data-panel]').length;var c=Number(r.getAttribute('data-current'));var g=this.getAttribute('data-go');var n=g==='next'?c+1:g==='back'?c-1:Number(g);n=Math.max(1,Math.min(t,n));r.setAttribute('data-current',String(n));r.querySelectorAll('[data-panel]').forEach(function(p){p.style.display=Number(p.getAttribute('data-panel'))===n?'block':'none';});r.querySelectorAll('[data-step]').forEach(function(b){var on=Number(b.getAttribute('data-step'))===n;b.style.borderBottomColor=on?'#0f766e':'transparent';b.style.color=on?'#0f766e':'#475569';});var z=r.querySelector('[data-zaehler]');if(z){z.textContent='Schritt '+n+' von '+t;}r.querySelectorAll('[data-go=back]').forEach(function(b){b.style.visibility=n===1?'hidden':'visible';});r.querySelectorAll('[data-go=next]').forEach(function(b){b.style.visibility=n===t?'hidden':'visible';});
</script>

<!-- Farben des Lernpaket-Rahmens (Übersicht, Leiste) an das Layout anpassen -->
<script type="text/x-vorlage" data-name="player-css">
:root { --hauptfarbe: #0f766e; --hauptfarbe-hell: #ecfdf5; --akzent: #5eead4; --dunkel: #134e4a; --seite: #f1f5f9; --text: #0f172a; --text-blass: #64748b; --linie: #e2e8f0; }
.leiste { background: linear-gradient(110deg, #0f2f2d, #134e4a 54%, #0f2f2d); }
.uebersicht { background: radial-gradient(circle at 85% 0%, rgba(15, 118, 110, .45), transparent 480px), var(--dunkel); }
.ue-karte { background: #ffffff; }
.balken > span { background: linear-gradient(90deg, #115e59, var(--hauptfarbe)); }
</script>
</body>
</html>
