<!DOCTYPE html>
<!--
╔══════════════════════════════════════════════════════════════════════════════╗
║  KURS-PLAYER  ·  Vorlage für Kurs-Lernpakete (SCORM)                         ║
║  Datei: Vorlage_Kurs.html                                                    ║
╚══════════════════════════════════════════════════════════════════════════════╝

  WAS IST DAS?
  ────────────
  Diese Datei ist der „Rahmen“ (Player) für die Kursseiten. Das Studio
  (der „Generator“) setzt die Seiten eines Kurses hier ein und packt alles
  als SCORM-Lernpaket (.zip) für Moodle. Im Lernpaket heißt diese Datei
  dann „index.html“.

  Der Player fügt den Seiten nur wenig hinzu:
    • oben eine schmale Leiste: Übersicht, Kursfortschritt, Modul vor/zurück
    • eine Kursübersicht mit allen Modulen und ihrem Fortschritt
    • unter jedem Modul eine Fußleiste („3 von 8 Seiten angesehen“)
    • die Verbindung zu Moodle: Fortschritt speichern, Abschluss melden
  Die Seiten selbst bleiben unverändert (Aussehen, Blättern, Videos …).

  ANSEHEN UND AUSPROBIEREN
  Diese Vorlage ist absichtlich leer (keine Kursseiten), damit sie sich
  leicht bearbeiten lässt. Einen fertigen Kurs zeigt das Studio unter
  „Lernpaket erstellen → Ganzen Kurs ansehen“. Ohne Moodle wird der
  Fortschritt nur im Browser gespeichert.

  WAS DARF ICH HIER ÄNDERN?
  ✔ A) FARBEN UND SCHRIFT  →  im <style>-Bereich, ganz oben
       (ein Layout bringt meist eigene Farben mit: „player-css“ in der Layout-Datei)
  ✔ 2) TEXTE               →  im <script>-Bereich, alle Sätze der Leiste/Übersicht
  ✘ „1) EINSTELLUNGEN“ und den MODUL-SPEICHER nicht von Hand ändern.
    Beides schreibt der Generator bei jedem Erzeugen neu.
  ✘ Alles ab „AB HIER: PROGRAMM“ nur mit JavaScript-Kenntnissen ändern.

  SO GEHST DU VOR
  1. Sicherheitskopie anlegen (z. B. „Vorlage_Kurs_Sicherung.html“).
  2. Datei mit einem Texteditor öffnen (Notepad++, VS Code, Editor).
  3. Ändern und speichern.
  4. Die Vorlage neu ins Studio einsetzen (bauen.ps1 ausführen) und
     das Lernpaket neu erzeugen.
-->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Titel im Browser-Tab. Der Generator setzt hier den Kursnamen ein. -->
<title>Kurs</title>

<style>
/* ════════════════════════════════════════════════════════════════════════════
   A) FARBEN UND SCHRIFT   ✔ darf geändert werden
   ────────────────────────────────────────────────────────────────────────────
   Gilt nur für die Teile, die der Player hinzufügt (Leiste, Übersicht,
   Fußleiste). Deine Kursseiten behalten ihr eigenes Aussehen.
   Farben als Hex-Code (# und 6 Zeichen). Nur den Wert rechts ändern,
   das Semikolon ; am Ende stehen lassen.
   ════════════════════════════════════════════════════════════════════════════ */
:root {
  /* Hauptfarbe: Knöpfe, Fortschrittsbalken, begonnene Module */
  --hauptfarbe:        #1f5fbf;
  /* sehr helle Variante der Hauptfarbe (Hinweis-Kästen) */
  --hauptfarbe-hell:   #eef3fb;
  /* Akzentfarbe im dunklen Bereich (Kategorie-Zeile der Übersicht) */
  --akzent:            #8fb8f5;
  /* dunkler Hintergrund von Leiste und Übersicht */
  --dunkel:            #141c28;
  /* Schriftfarbe auf dunklem Hintergrund */
  --dunkel-text:       #f7f9fc;
  /* Hintergrund der Seite */
  --seite:             #eef1f6;
  /* normale und blasse Schriftfarbe */
  --text:              #141c28;
  --text-blass:        #5a6676;
  /* dünne Linien und Rahmen */
  --linie:             #d7deea;
  /* Grün für „fertig“ */
  --fertig:            #1d7a4a;
  --fertig-hell:       #e3f3ea;
  /* Gelb für Warnungen */
  --warnung:           #8a5a00;
  --warnung-hell:      #fff4dc;
  /* Rot für niedrige Handlungssicherheit (Gamification) */
  --gefahr:            #b02a2a;
  /* Schriftart */
  --schrift:           Arial, Helvetica, sans-serif;
  /* maximale Breite der Übersicht */
  --breite-uebersicht: 1100px;
}

/* ════════════════════════════════════════════════════════════════════════════
   B) AUFBAU UND GESTALTUNG   (nur ändern, wenn du CSS kennst)
   ════════════════════════════════════════════════════════════════════════════ */
* { box-sizing: border-box; }
body { margin: 0; background: var(--seite); color: var(--text); font-family: var(--schrift); }

/* ① Leiste oben (bleibt beim Scrollen sichtbar) */
/* Anker für „nach dem Blättern an den Anfang der Seite“ (Abstand = Höhe der Leiste oben) */
.oben-anker { height: 1px; margin-bottom: -1px; scroll-margin-top: 60px; pointer-events: none; }
.leiste {
  position: sticky; top: 0; z-index: 1000;
  display: flex; align-items: center; flex-wrap: wrap; gap: 8px 10px;
  padding: 8px 16px; color: var(--dunkel-text);
  background: linear-gradient(110deg, #111821, #1d2633 54%, #131a24);
  box-shadow: 0 2px 10px rgba(0, 0, 0, .25);
  font-family: var(--schrift);
}
.leiste-knopf {
  font: inherit; font-size: 14px; font-weight: 700; color: var(--dunkel-text);
  background: rgba(255, 255, 255, .08); border: 1px solid #334155; border-radius: 999px;
  padding: 6px 14px; cursor: pointer;
}
.leiste-knopf:hover { background: rgba(255, 255, 255, .16); }
.leiste-knopf:disabled { opacity: .35; cursor: default; }
.leiste-titel { flex: 1 1 200px; min-width: 0; font-weight: 700; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.leiste-fortschritt { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #dbe2ea; }
.mini-balken { width: 110px; height: 8px; border-radius: 999px; background: rgba(255, 255, 255, .15); overflow: hidden; }
.mini-balken > span { display: block; height: 100%; border-radius: 999px; background: var(--hauptfarbe); }
.leiste-punkte { display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; color: var(--dunkel-text); background: rgba(255, 255, 255, .1); border-radius: 999px; padding: 5px 12px; }

/* Bereich unter der Leiste */
.inhalt { padding: 16px; min-width: 0; flex: 1 1 0; }

/* Kursübersicht „Seitenleiste“ (Einstellung „uebersichtStil“, SCORM-AutorenStudio 3.12) */
.kurs-rahmen { display: flex; align-items: flex-start; }
.seitenleiste {
  flex: 0 0 260px; width: 260px; box-sizing: border-box; position: sticky; top: 53px; align-self: stretch;
  max-height: calc(100vh - 53px); overflow-y: auto; padding: 16px 12px; background: var(--dunkel); color: var(--dunkel-text);
  font-family: var(--schrift);
}
.sl-heim {
  display: block; width: 100%; text-align: left; font: inherit; font-weight: 700; font-size: 14px; color: var(--dunkel-text);
  background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .18); border-radius: 10px; padding: 10px 14px;
  cursor: pointer; margin-bottom: 16px;
}
.sl-heim.an { background: var(--hauptfarbe); border-color: var(--hauptfarbe); }
.sl-gruppe-titel { font-size: 11px; font-weight: 700; letter-spacing: .6px; color: var(--akzent); text-transform: uppercase; margin: 16px 0 6px; padding: 0 6px; }
.sl-gruppe-titel:first-of-type { margin-top: 0; }
.sl-eintrag {
  display: block; width: 100%; text-align: left; font: inherit; font-size: 14px; color: #dbe2ea; background: transparent; border: 0;
  border-radius: 8px; padding: 8px 10px; cursor: pointer; margin: 1px 0;
}
.sl-eintrag:hover { background: rgba(255, 255, 255, .08); }
.sl-eintrag.an { background: var(--hauptfarbe); color: #fff; font-weight: 700; }
.sl-eintrag.fertig::after { content: " ✓"; }
.sl-eintrag.gesperrt { opacity: .5; cursor: not-allowed; }
.seitenleiste[hidden] { display: none; }
@media (max-width: 760px) {
  .kurs-rahmen { flex-direction: column; align-items: stretch; }
  .inhalt { width: 100%; max-width: 100%; box-sizing: border-box; }
  .seitenleiste { position: static; width: 100%; max-height: none; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .sl-heim { width: auto; margin: 0 6px 0 0; }
  .sl-gruppe-titel { width: 100%; margin: 6px 0 0; }
}

/* Dashboard-Kursübersicht (Hero-Karte, Kennzahlen, Lernstand) */
.ue-dash { max-width: var(--breite-uebersicht); margin: 0 auto; }
.ue-hero {
  background: radial-gradient(circle at 85% 0%, rgba(255, 255, 255, .08), transparent 480px), var(--dunkel); color: var(--dunkel-text);
  border-radius: 18px; padding: 32px 36px; margin-bottom: 18px;
}
.ue-hero-label { color: var(--akzent); font-weight: 700; font-size: 13px; letter-spacing: .5px; text-transform: uppercase; margin-bottom: 10px; }
.ue-hero-titel { font-weight: 700; font-size: 32px; line-height: 1.2; margin: 0 0 12px; }
.ue-hero-text { font-size: 16px; line-height: 1.55; max-width: 680px; margin: 0 0 20px; color: #e8edf3; }
.ue-hero-knoepfe { display: flex; gap: 10px; flex-wrap: wrap; }
.kennzahlen { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 18px; }
.kz-karte { background: #fff; border: 1px solid var(--linie); border-radius: 14px; padding: 18px 20px; text-align: center; }
.kz-zahl { font-size: 30px; font-weight: 700; color: var(--text); }
.kz-label { font-size: 13px; color: var(--text-blass); margin-top: 2px; }
.lernstand-karte { background: #fff; border: 1px solid var(--linie); border-radius: 14px; padding: 22px 24px; }
.lernstand-karte h2 { margin: 0 0 12px; font-size: 18px; }

/* Hinweis-Kästen (Vorschau, Ansichtsmodus, Speicherfehler) */
.hinweis { max-width: var(--breite-uebersicht); margin: 0 auto 12px; padding: 10px 14px; border-radius: 12px; border-left: 5px solid var(--hauptfarbe); background: var(--hauptfarbe-hell); font-size: 14px; }
.hinweis-warnung { border-color: var(--warnung); background: var(--warnung-hell); }

/* ② Kursübersicht */
.uebersicht {
  max-width: var(--breite-uebersicht); margin: 0 auto; border-radius: 14px; overflow: hidden;
  background: radial-gradient(circle at 85% 0%, rgba(31, 95, 191, .35), transparent 480px), var(--dunkel);
}
.ue-kopf { padding: 32px 40px 46px; color: var(--dunkel-text); }
.ue-kategorie { color: var(--akzent); font-weight: 700; font-size: 15px; letter-spacing: .3px; margin-bottom: 10px; }
.ue-titel { font-weight: 700; font-size: 36px; line-height: 1.2; letter-spacing: -.8px; margin: 0 0 12px; }
.ue-text { font-size: 17px; line-height: 1.55; max-width: 720px; margin: 0; }
.ue-rahmen { padding: 0 2% 26px; margin-top: -18px; }
.ue-karte { background: linear-gradient(155deg, #fff 0%, #f7f9fc 65%, #e9eef5 100%); border-radius: 20px; padding: 28px 30px; box-shadow: 0 14px 32px rgba(0, 0, 0, .16); }
.ue-zeile { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.ue-stand { flex: 1 1 260px; font-size: 14px; color: var(--text-blass); }
.ue-stand b { color: var(--text); }
.balken { height: 12px; border-radius: 999px; background: #e2e8f0; margin: 8px 0 4px; overflow: hidden; }
.balken > span { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #17478f, var(--hauptfarbe)); }
.fertig-meldung { padding: 10px 14px; border-radius: 12px; background: var(--fertig-hell); border-left: 5px solid var(--fertig); font-weight: 700; margin-bottom: 16px; }

/* Gamification (SCORM-AutorenStudio 3.10): Anzeige der Handlungssicherheit und Abzeichen */
.einsatz-box { margin-bottom: 18px; }
.einsatz-kopf { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; font-weight: 700; margin-bottom: 6px; }
.einsatz-balken { height: 12px; border-radius: 999px; background: #e2e8f0; overflow: hidden; }
.einsatz-balken > span { display: block; height: 100%; border-radius: 999px; }
.einsatz-hinweis { font-size: 12px; color: var(--text-blass); margin-top: 4px; }
.abzeichen-reihe { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
.abzeichen { display: inline-flex; align-items: center; background: #fff; border: 1px solid var(--linie); border-radius: 999px; padding: 6px 14px; font-size: 13px; font-weight: 700; color: var(--text); }
.abzeichen-bild { width: 18px; height: 18px; object-fit: contain; margin-right: 6px; border-radius: 4px; flex: none; vertical-align: middle; }

/* Modul-Karten in der Übersicht */
.modul-liste { display: grid; gap: 10px; }
.modul-karte {
  display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
  font: inherit; color: var(--text); background: #fff; border: 1px solid var(--linie);
  border-radius: 14px; padding: 12px 16px; cursor: pointer;
}
.modul-karte:hover { border-color: #a9bbd1; }
.modul-nr { flex: none; width: 38px; height: 38px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; color: #fff; background: #2a3646; }
.modul-karte.begonnen .modul-nr { background: var(--hauptfarbe); }
.modul-karte.fertig .modul-nr { background: var(--fertig); }
.modul-info { flex: 1; min-width: 0; }
.modul-name { font-weight: 700; font-size: 16px; }
.modul-status { font-size: 13px; color: var(--text-blass); }
.modul-karte .balken { height: 6px; margin: 6px 0 0; }
.modul-karte.fertig .balken > span { background: var(--fertig); }

/* Knöpfe */
.knopf { font: inherit; font-weight: 700; font-size: 15px; border-radius: 999px; padding: 11px 24px; cursor: pointer; color: #fff; background: var(--hauptfarbe); border: 2px solid var(--hauptfarbe); }
.knopf-zweit { color: var(--hauptfarbe); background: #fff; border-color: #c5d0de; }
.knopf:disabled { opacity: .4; cursor: default; }
.knopf:focus-visible, .leiste-knopf:focus-visible, .modul-karte:focus-visible { outline: 3px solid var(--akzent); outline-offset: 2px; }

/* ③ Die Module (deine Kursseiten). Nur das aktuelle ist sichtbar. */
.modul[hidden] { display: none !important; }
/* Besteht ein Modul aus mehreren Teilen (HTML-Seiten), ist nur der aktuelle Teil sichtbar */
.teil[hidden] { display: none !important; }

/* ④ Fußleiste unter dem Modul */
.modul-fuss {
  max-width: 1600px; margin: 16px auto 0; display: flex; flex-wrap: wrap; gap: 10px 16px;
  align-items: center; justify-content: space-between; padding: 12px 16px;
  background: #fff; border: 1px solid var(--linie); border-radius: 14px; font-family: var(--schrift);
}
.modul-fuss[hidden] { display: none; }
.fuss-info { font-size: 14px; color: var(--text-blass); }
.fuss-info b { color: var(--text); }
.fuss-info .ok { color: var(--fertig); font-weight: 700; }
.fuss-knoepfe { display: flex; flex-wrap: wrap; gap: 8px; }
.fuss-knoepfe .knopf { padding: 8px 18px; font-size: 14px; }

/* Ausgegraute Einträge im Modul-Menü (Modul nicht in diesem Paket) */
.nicht-im-paket { opacity: .4 !important; }

/* C) HANDY-ANSICHT (Bildschirm schmaler als 600 Pixel) */
@media (max-width: 600px) {
  .inhalt { padding: 8px; }
  .ue-kopf { padding: 22px 18px 34px; }
  .ue-titel { font-size: 26px; }
  .ue-karte { padding: 18px 14px; }
  .mini-balken { width: 60px; }
}

/* D) ANPASSUNG AN DIE BILDSCHIRMGRÖSSE (SCORM-AutorenStudio 3.45)
   Gilt für alle Layouts. Das Programm markiert dafür einige Bausteine der Kursseiten mit Klassen
   (lm-…), siehe Funktion bildschirmAnpassen. !important ist nötig, weil die Kursseiten Inline-Stile haben. */
/* Breite Tabellen rollen für sich, Bilder und Videos werden nie breiter als der Platz */
.lm-tabelle { max-width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
.modul [data-lm="text"] img, .modul [data-lm="medium"] img { max-width: 100%; height: auto; }
.modul [data-lm="text"] video, .modul [data-lm="medium"] video, .modul [data-lm="text"] iframe { max-width: 100%; }
.modul [data-lm="text"] pre { max-width: 100%; overflow-x: auto; white-space: pre-wrap; }
.modul [data-lm="text"] { overflow-wrap: break-word; }

/* Tablet und kleines Fenster: Leiste oben bleibt einzeilig, der Titel wird bei Bedarf gekürzt */
@media (max-width: 900px) {
  .leiste { flex-wrap: nowrap; }
  .leiste-titel { flex: 1 1 0; }
  .leiste > * { flex-shrink: 0; }
  .leiste > .leiste-titel { flex-shrink: 1; }
  .mini-balken { width: 70px; }
}

/* Handy (schmaler als 600 Pixel) */
@media (max-width: 600px) {
  /* Leiste oben in einer Zeile: nur Zeichen statt „☰ Übersicht“, Fortschritt als dünner Strich unten */
  .leiste { flex-wrap: nowrap; gap: 6px; padding: 7px 10px 9px; }
  .leiste-knopf { padding: 6px 11px; flex: none; }
  .leiste-wort { display: none; }
  .leiste-titel { flex: 1 1 0; font-size: 14px; }
  .leiste-punkte { flex: none; padding: 4px 9px; }
  .leiste-fortschritt { position: absolute; left: 0; right: 0; bottom: 0; gap: 0; }
  .leiste-fortschritt .mini-balken { width: 100%; height: 3px; border-radius: 0; background: rgba(255, 255, 255, .12); }
  .leiste-fortschritt .mini-balken > span { border-radius: 0; }
  #leisteProzent { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .oben-anker { scroll-margin-top: 50px; }

  /* Kursseiten: Schritt-Knöpfe als Reihe über dem Inhalt statt als Spalte daneben */
  .lm-schritte-rahmen { flex-direction: column !important; align-items: stretch !important; padding-right: 0 !important; gap: 0 !important; }
  .lm-schritte-senkrecht {
    flex-direction: row !important; flex-wrap: nowrap !important; justify-content: flex-start !important; align-items: center !important;
    width: auto !important; flex: none !important; overflow-x: auto; padding: 10px 14px !important; gap: 8px !important;
    border-radius: 0 !important; margin: 0 !important; border-bottom: 0 !important;
  }
  .lm-schritte-rahmen > :not(.lm-schritte-senkrecht) { border-top-left-radius: 0 !important; border-top-right-radius: 0 !important; }
  /* Schritt-Knöpfe nebeneinander (Reiter): eine Zeile, seitlich wischen statt Umbruch */
  .lm-schritte-reihe { flex-wrap: nowrap !important; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: thin; }
  .lm-schritte-senkrecht > *, .lm-schritte-reihe > * { flex: 0 0 auto !important; white-space: nowrap; }

  /* Fußleiste: Seitenpunkte bzw. „Schritt 2 von 4“ oben, darunter „Zurück“ und „Weiter“ nebeneinander */
  .lm-fussleiste { flex-wrap: wrap !important; gap: 12px 10px !important; }
  .lm-fussleiste > .lm-fuss-mitte { order: -1; flex: 1 1 100% !important; text-align: center; justify-content: center !important; }
  .lm-fussleiste > [data-go="back"], .lm-fussleiste > [data-go="next"] { flex: 1 1 0 !important; min-width: 0 !important; padding-left: 10px !important; padding-right: 10px !important; }

  /* Kursübersicht (Dashboard) */
  .ue-hero { padding: 22px 18px; border-radius: 14px; }
  .ue-hero-titel { font-size: 24px; }
  .lernstand-karte { padding: 16px 14px; }
  .kz-karte { padding: 12px 10px; }
  .kz-zahl { font-size: 24px; }
  .zert-blatt { padding: 28px 18px; }
  .zert-titel { font-size: 26px; margin-bottom: 20px; }
}
/* Handy quer (wenig Höhe): Leiste oben scrollt mit, damit mehr vom Inhalt sichtbar bleibt */
@media (max-height: 480px) and (orientation: landscape) {
  .leiste { position: static; }
  .seitenleiste { top: 0; max-height: 100vh; }
}

/* E) FESTER RAHMEN (SCORM-AutorenStudio 3.50) – ab Tablet-Größe
   Im Modul bleiben die Leiste oben, Kopfzeile und Titelbereich der Seite, die Schritt-Knöpfe und die
   Fußleiste (Zurück · Weiter) stehen; nur der Inhalt des offenen Schritts rollt. Der Titelbereich
   wird dafür flacher. Das Programm markiert die Bausteine (Funktion rahmenMarkieren) und setzt
   den Schalter „ansicht-modul“ an <html>. Die Werte --lm-k-… sind „höchstens so groß wie bisher“
   (min(…, Originalwert)), damit kein Layout größer wird, als es war.
   Auf dem Handy und in sehr niedrigen Fenstern bleibt alles wie bisher (ganze Seite rollt). */
@media screen and (min-width: 761px) and (min-height: 500px) {
  .leiste { padding-top: 5px; padding-bottom: 5px; }
  .leiste-knopf { padding-top: 4px; padding-bottom: 4px; }
  html.ansicht-modul, html.ansicht-modul body { height: 100%; }
  html.ansicht-modul body { display: flex; flex-direction: column; overflow: hidden; }
  html.ansicht-modul .leiste { flex: none; }
  html.ansicht-modul .kurs-rahmen { flex: 1 1 0; min-height: 0; align-items: stretch; }
  html.ansicht-modul .seitenleiste { position: static; max-height: none; }
  html.ansicht-modul .inhalt { display: flex; flex-direction: column; min-height: 0; padding-top: 10px; padding-bottom: 10px; overflow: hidden; }
  html.ansicht-modul .inhalt > * { flex: none; width: 100%; }
  html.ansicht-modul #module { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; }
  html.ansicht-modul .modul:not([hidden]), html.ansicht-modul .lm-teil:not([hidden]) { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; }
  html.ansicht-modul .lm-teil > * { flex: none; }
  html.ansicht-modul .lm-teil.lm-fest-ganz { display: block; overflow-y: auto; }
  html.ansicht-modul .modul-fuss { margin-top: 8px; padding-top: 6px; padding-bottom: 6px; }
  html.ansicht-modul .modul-fuss .knopf { padding-top: 5px; padding-bottom: 5px; }
  html.ansicht-modul .hinweis { margin-bottom: 8px; padding-top: 6px; padding-bottom: 6px; }

    if (S.t) d.t = S.t;                               // „t“ = Abschlusstest: v Versuche, b bestes Ergebnis in %, ok bestanden
    if (S.p) d.p = S.p;                                // „p“ = Punkte (Gamification)
    if (S.b && Object.keys(S.b).length) d.b = S.b;     // „b“ = freigeschaltete Abzeichen
    if (S.s && Object.keys(S.s).length) d.s = S.s;     // „s“ = Ausgang je Fallszenario (gut/neutral/schlecht)
    return 'K1' + JSON.stringify(d);
  }

  // Nur den Text bei Moodle ablegen (ohne sofort zu senden): für die Position
  function positionMerken() {
    if (SCORM.verbunden) { if (!SCORM.nurAnsehen) SCORM.schreib('cmi.suspend_data', datenText()); }
    else { try { localStorage.setItem(SPEICHER_SCHLUESSEL, datenText()); } catch (e) {} }
  }
  // Alles speichern und an Moodle senden: nach jeder neu angesehenen Seite
  function speichern() {
    var st = zaehlen();
    if (st.fertig && !S.d) { var h = new Date(); S.d = h.getFullYear() + '-' + ('0' + (h.getMonth() + 1)).slice(-2) + '-' + ('0' + h.getDate()).slice(-2); }
    if (SCORM.verbunden) {
      if (SCORM.nurAnsehen) return;
      var ok = SCORM.schreib('cmi.suspend_data', datenText());
      SCORM.schreib('cmi.core.score.min', '0');
      SCORM.schreib('cmi.core.score.max', '100');
      // Bewertung: Prozent angesehener Seiten – oder, bei „Bestehen über Fragen“, Prozent richtiger Fragen –
      // oder, mit Abschlusstest, das beste Testergebnis (vor dem ersten Versuch keine Bewertung)
      if (TEST) { if (S.t && S.t.v) SCORM.schreib('cmi.core.score.raw', String(S.t.b)); }
      else SCORM.schreib('cmi.core.score.raw', String(FRAGEN_NOETIG && FRAGEN_IDS.length ? st.fprozent : st.prozent));
      SCORM.schreib('cmi.core.lesson_status', st.fertig ? (TEST ? 'passed' : 'completed') : (TEST && testStand().aufgebraucht ? 'failed' : 'incomplete'));
      if (!(SCORM.sichern() && ok)) hinweis('warnung', T('speicherFehler'));
    } else {
      try { localStorage.setItem(SPEICHER_SCHLUESSEL, datenText()); } catch (e) {}
    }
  }

  // t = ein Teil (eine Kursseite), nr = Nummer des Schritts darin
  function istGesehen(t, nr) {
    var k = S.g[t.id] || '', i = t.seiten.indexOf(String(nr));
    return i >= 0 && k.charAt(i) === '1';
  }
  // Markiert eine Seite als angesehen. Gibt true zurück, wenn sie neu war.
  function markieren(t, nr) {
    var i = t.seiten.indexOf(String(nr));
    if (i < 0 || istGesehen(t, nr)) return false;
    var k = S.g[t.id] || '';
    while (k.length < t.seiten.length) k += '0';
    S.g[t.id] = k.slice(0, i) + '1' + k.slice(i + 1);
    return true;
  }
  function teilStand(t) {
    var n = 0;
    t.seiten.forEach(function (nr) { if (istGesehen(t, nr)) n++; });
    return { gesehen: n, seiten: t.seiten.length, fertig: n === t.seiten.length };
  }
  function modulStand(m) {
    var g = 0;
    m.teile.forEach(function (t) { g += teilStand(t).gesehen; });
    return { gesehen: g, seiten: m.seitenAnzahl, fertig: g === m.seitenAnzahl, teile: m.teile.length };
  }
  function zaehlen() {
    var g = 0, s = 0, r = 0;
    MODULE.forEach(function (m) { var st = modulStand(m); g += st.gesehen; s += st.seiten; });
    FRAGEN_IDS.forEach(function (id) { if (S.f[id]) r++; });
    var prozent = s ? Math.floor(g / s * 100) : 100, fprozent = FRAGEN_IDS.length ? Math.floor(r / FRAGEN_IDS.length * 100) : 100;
    var seitenFertig = prozent >= ABSCHLUSS && (!FRAGEN_NOETIG || fprozent >= FRAGEN_NOETIG);
    return { gesehen: g, seiten: s, prozent: prozent, richtig: r, fragen: FRAGEN_IDS.length, fprozent: fprozent, fnoetig: FRAGEN_NOETIG,
      seitenFertig: seitenFertig, fertig: seitenFertig && (!TEST || !!(S.t && S.t.ok)) };
  }
  // Stand des Abschlusstests: gesperrt? bestanden? Versuche übrig?
  function testStand() {
    var t = S.t || { v: 0, b: 0, ok: 0 };
    var zu = !!TEST && TEST.nachModulen && !EIN.vorschau && !zaehlen().seitenFertig && !t.ok;
    var rest = TEST && TEST.versuche ? Math.max(0, TEST.versuche - t.v) : Infinity;
    return { zu: zu, ok: !!t.ok, versuche: t.v, bestes: t.b, rest: rest, aufgebraucht: !t.ok && rest === 0 && !(LAUF && !LAUF.fertig) };
  }
  // Module der Reihe nach: Modul i ist gesperrt, solange Modul i-1 nicht fertig ist
  // Modul-Index zu einer Modul-Kennung (für die adaptive Wiederholungs-Empfehlung des Abschlusstests), -1 wenn nicht gefunden
  function modulIndexVon(id) { for (var i = 0; i < MODULE.length; i++) if (MODULE[i].id === id) return i; return -1; }
  // Nach einem nicht bestandenen Testversuch wird das empfohlene Wiederholungsmodul freigeschaltet,
  // auch wenn „Module der Reihe nach freischalten“ es sonst sperren würde.
  function wiederholungFreigeschaltet(i) { return !!(TEST && TEST.wiederholungModul && MODULE[i] && MODULE[i].id === TEST.wiederholungModul && S.t && S.t.v > 0 && !S.t.ok); }
  function gesperrt(i) { return REIHENFOLGE && i > 0 && !modulStand(MODULE[i - 1]).fertig && !wiederholungFreigeschaltet(i); }

  // ── Gamification: Punkte, Abzeichen, Handlungssicherheit (Einstellung „punkte“) ───────
  // Punkte: +10 je richtig beantworteter Frage auf einer Kursseite (einmalig), +50 für den
  // bestandenen Abschlusstest, +15/+5/0 je nach Ausgang eines Fallszenarios (gut/neutral/schlecht).
  // Abzeichen schalten sich automatisch frei, sobald ihre Bedingung erfüllt ist, und bleiben erhalten.
  // Abzeichen kommen aus EIN.abzeichen (im SCORM-AutorenStudio unter 🏅 Abzeichen eingerichtet, je { id, text, art, param }).
  // Leer = die fünf bisherigen Standard-Abzeichen (bisheriges Verhalten bleibt für ältere Lernpakete erhalten).
  // Die Bedingung kommt als DATEN (art/param), nicht als Programmcode – sicher auch aus fremden Lernpaketen.
  var ABZEICHEN_STANDARD = [
    { id: 'voll', text: T('abzVollstaendig'), art: 'kursFertig' },
    { id: 'fragen', text: T('abzFragen'), art: 'alleFragenRichtig' },
    { id: 'test', text: T('abzTest'), art: 'testBestanden' },
    { id: 'szenario', text: T('abzSzenario'), art: 'szenarienGut' },
    { id: 'einsatz', text: T('abzEinsatz'), art: 'einsatzbereit' }
  ];
  function abzeichenBedingung(b) {
    switch (b.art) {
      case 'kursFertig': return function () { return zaehlen().fertig; };
      case 'alleFragenRichtig': return function () { return FRAGEN_IDS.length > 0 && zaehlen().fprozent === 100; };
      case 'testBestanden': return function () { return !!TEST && !!(S.t && S.t.ok); };
      case 'testVersuch1': return function () { return !!TEST && !!(S.t && S.t.ok) && S.t.v === 1; };
      case 'testPerfekt': return function () { return !!TEST && !!(S.t && S.t.ok) && S.t.b >= 100; };
      case 'szenarienGut': return function () { var ks = Object.keys(S.s || {}); return ks.length > 0 && ks.every(function (k) { return S.s[k] === 'gut'; }); };
      case 'einsatzbereit': return function () { return handlungssicherheit().prozent >= 100; };
      case 'punkte': { var sp = Math.max(0, parseInt(b.param, 10) || 0); return function () { return (S.p || 0) >= sp; }; }
      case 'fragenAnzahl': { var sf = Math.max(0, parseInt(b.param, 10) || 0); return function () { return Object.keys(S.f || {}).length >= sf; }; }
      case 'modulFertig': { var mid = String(b.param || ''); return function () { for (var i = 0; i < MODULE.length; i++) if (MODULE[i].id === mid) return modulStand(MODULE[i]).fertig; return false; }; }
      case 'tageszeitFrueh': return function () { return new Date().getHours() < 7; };
      case 'tageszeitSpaet': return function () { return new Date().getHours() >= 22; };
      case 'wochenende': return function () { var t = new Date().getDay(); return t === 0 || t === 6; };
      default: return function () { return false; };
    }
  }
  var BADGES = (Array.isArray(EIN.abzeichen) && EIN.abzeichen.length ? EIN.abzeichen : ABZEICHEN_STANDARD).map(function (b) {
    return { id: b.id, text: function () { return b.text; }, bild: b.bild || '', bedingung: abzeichenBedingung(b) };
  });
  function punkteHinzu(n) { if (PUNKTE_AN && n) S.p = (S.p || 0) + n; }
  function abzeichenPruefen() {
    if (!PUNKTE_AN) return;
    S.b = S.b || {};
    BADGES.forEach(function (b) {
      if (!S.b[b.id] && b.bedingung()) { S.b[b.id] = 1; hinweis('', (b.bild ? '<img src="' + esc(b.bild) + '" alt="" class="abzeichen-bild">' : '') + T('neuesAbzeichen', { text: b.text() })); }
    });
  }
  // 0–100: Mittel aus Seitenfortschritt, Fragen- und Testergebnis sowie Fallszenarien (nur was im Kurs vorkommt)
  function handlungssicherheit() {
    var st = zaehlen(), teile = [st.prozent];
    if (FRAGEN_IDS.length) teile.push(st.fprozent);
    if (TEST && S.t && S.t.v) teile.push(S.t.b);
    var sk = Object.keys(S.s || {});
    if (sk.length) {
      var summe = 0;
      sk.forEach(function (k) { summe += S.s[k] === 'gut' ? 100 : S.s[k] === 'schlecht' ? 20 : 60; });
      teile.push(Math.round(summe / sk.length));
    }
    var prozent = Math.round(teile.reduce(function (a, b) { return a + b; }, 0) / teile.length);
    var farbe = prozent >= 80 ? 'var(--fertig)' : prozent >= 50 ? 'var(--warnung)' : 'var(--gefahr)';
    return { prozent: prozent, farbe: farbe };
  }

  // ── Kursübersicht „Seitenleiste“ (Einstellung „uebersichtStil“) ───────────────────────
  // Gruppiert die Module nach ihrer „Gruppe“ (Modul-Einstellung im Studio); Module ohne
  // Gruppe stehen oben, ohne Überschrift. Wird einmal aufgebaut, danach nur noch markiert.
  function seitenleisteAufbauen() {
    if (!SEITENLEISTE_AN || EINZEL) return;
    var html = '<button type="button" class="sl-heim" id="slHeim">' + T('slHeim') + '</button>';
    var gruppen = [], ohneGruppe = [];
    MODULE.forEach(function (m, i) {
      if (m.gruppe) { var g = null; gruppen.forEach(function (x) { if (x.name === m.gruppe) g = x; }); if (!g) { g = { name: m.gruppe, teile: [] }; gruppen.push(g); } g.teile.push(i); }
      else ohneGruppe.push(i);
    });
    var eintrag = function (i) { return '<button type="button" class="sl-eintrag" data-oeffne="' + i + '">' + (i + 1) + '. ' + esc(MODULE[i].titel) + '</button>'; };
    ohneGruppe.forEach(function (i) { html += eintrag(i); });
    gruppen.forEach(function (g) { html += '<div class="sl-gruppe-titel">' + esc(g.name) + '</div>' + g.teile.map(eintrag).join(''); });
    if (TEST) html += '<div class="sl-gruppe-titel">' + T('testKategorie') + '</div><button type="button" class="sl-eintrag" data-test="1">' + esc(TEST.titel) + '</button>';
    var sl = $('seitenleiste');
    sl.innerHTML = html; sl.hidden = false;
    $('slHeim').onclick = uebersichtZeigen;
    sl.querySelectorAll('[data-oeffne]').forEach(function (b) { b.onclick = function () { modulZeigen(Number(b.getAttribute('data-oeffne'))); }; });
    if (sl.querySelector('[data-test]')) sl.querySelector('[data-test]').onclick = testZeigen;
  }
  // Aktiven Eintrag und „fertig“-Haken in der Seitenleiste aktualisieren (bei jedem anzeigeAktualisieren)
  function seitenleisteAktualisieren() {
    if (!SEITENLEISTE_AN || EINZEL) return;
    var sl = $('seitenleiste'); if (!sl.firstChild) return;
    if ($('slHeim')) $('slHeim').classList.toggle('an', aktuell === -1);
    sl.querySelectorAll('[data-oeffne]').forEach(function (b) {
      var i = Number(b.getAttribute('data-oeffne'));
      b.classList.toggle('an', i === aktuell);
      b.classList.toggle('fertig', modulStand(MODULE[i]).fertig);
      b.classList.toggle('gesperrt', gesperrt(i));
    });
    var tb = sl.querySelector('[data-test]'); if (tb) tb.classList.toggle('an', aktuell === -2);
  }
  // Dashboard-Inhalt der Übersicht (Hero-Karte, Kennzahlen, Lernstand) für „uebersichtStil: seitenleiste“
  function dashboardHtml(st) {
    var fort = fortsetzenZiel(), ts = TEST ? testStand() : null;
    var zumTest = !!ts && st.seitenFertig && !ts.ok && !ts.aufgebraucht;
    var html = '<div class="ue-dash"><div class="ue-hero">' +
      (EIN.kategorie ? '<div class="ue-hero-label">' + esc(EIN.kategorie) + '</div>' : '') +
      '<h1 class="ue-hero-titel">' + esc(EIN.kursTitel) + '</h1>' +
      (EIN.einleitung ? '<p class="ue-hero-text">' + esc(EIN.einleitung) + '</p>' : '') +
      '<div class="ue-hero-knoepfe"><button type="button" class="knopf" id="knopfStart">' +
      (zumTest ? T('knopfZumTest') : fort ? T('knopfFortsetzen', { nr: fort.i + 1, seite: fort.seite }) : T('knopfStart')) + '</button></div></div>';
    html += '<div class="kennzahlen"><div class="kz-karte"><div class="kz-zahl">' + MODULE.length + '</div><div class="kz-label">' + T('kzLernabschnitte') + '</div></div>';
    if (FRAGEN_IDS.length) html += '<div class="kz-karte"><div class="kz-zahl">' + FRAGEN_IDS.length + '</div><div class="kz-label">' + T('kzUebungsfragen') + '</div></div>';
    var bestehen = TEST ? TEST.bestehen : FRAGEN_NOETIG;
    if (bestehen) html += '<div class="kz-karte"><div class="kz-zahl">' + bestehen + ' %</div><div class="kz-label">' + T('kzBestehensgrenze') + '</div></div>';
    html += '</div>';
    html += '<div class="lernstand-karte"><h2>' + T('lernstandTitel') + '</h2><div class="balken"><span style="width:' + st.prozent + '%"></span></div>' + T('stand', st) +
      (FRAGEN_NOETIG && st.fragen ? '<br>' + T('fragenStand', st) : '');
    if (st.fertig) html += '<div class="fertig-meldung" style="margin-top:14px;">' + T(TEST ? 'kursFertigTest' : FRAGEN_NOETIG && st.fragen ? 'kursFertigFragen' : 'kursFertig') +
      (EIN.zertifikat ? ' <button type="button" class="knopf knopf-zweit" id="knopfZertifikat">' + T('knopfZertifikat') + '</button>' : '') + '</div>';
    if (PUNKTE_AN) {
      var eb = handlungssicherheit(), abz = BADGES.filter(function (b) { return S.b && S.b[b.id]; });
      html += '<div class="einsatz-box" style="margin-top:16px;"><div class="einsatz-kopf"><span>' + T('einsatzTitel') + '</span><span>' + eb.prozent + ' % · 🏅 ' + (S.p || 0) + '</span></div>' +
        '<div class="einsatz-balken"><span style="width:' + eb.prozent + '%;background:' + eb.farbe + '"></span></div><div class="einsatz-hinweis">' + T('einsatzHinweis') + '</div></div>';
      if (abz.length) html += '<div class="abzeichen-reihe" style="margin-top:12px;">' + abz.map(function (b) { return '<span class="abzeichen">' + (b.bild ? '<img src="' + esc(b.bild) + '" alt="" class="abzeichen-bild">' : '') + esc(b.text()) + '</span>'; }).join('') + '</div>';
    }
    html += '</div></div>';
    return { html: html, fort: fort, zumTest: zumTest };
  }

  // ── 6) Was ist gerade zu sehen? ────────────────────────────────────────────
  // Deine Kursseiten blättern selbst (per onclick). Der Player beobachtet das:
  // Sobald sich im Modul etwas ändert, prüft er, welcher Schritt sichtbar ist.
  var aktuell = -1;        // Nummer des offenen Moduls (-1 = Übersicht)
  var teilNr = 0;          // Nummer des offenen Teils im Modul

  function sichtbar(el) { return el.getClientRects().length > 0; }

  function pruefen() {
    if (aktuell < 0) return;
    var t = MODULE[aktuell].teile[teilNr], neu = false, sichtbareSeite = '';
    if (!t.mitSchritten) { neu = markieren(t, '1'); sichtbareSeite = '1'; }
    else {
      Array.prototype.forEach.call(t.el.querySelectorAll('[data-panel]'), function (p) {
        if (sichtbar(p)) {
          var nr = p.getAttribute('data-panel');
          if (markieren(t, nr)) neu = true;
          if (!sichtbareSeite) sichtbareSeite = nr;
        }
      });
    }
    if (sichtbareSeite) {
      var l = t.id + ':' + sichtbareSeite;
      if (l !== S.l) { S.l = l; if (!neu) positionMerken(); }
    }
    if (neu) speichern();
    anzeigeAktualisieren();
  }
  var pruefTimer = null;
  function spaeterPruefen() { clearTimeout(pruefTimer); pruefTimer = setTimeout(pruefen, 60); }
  new MutationObserver(spaeterPruefen).observe($('module'), { attributes: true, subtree: true, attributeFilter: ['style', 'class', 'hidden', 'data-current'] });

  // Zu einem bestimmten Schritt blättern: den passenden Schritt-Knopf der Seite drücken
  function zuSeite(t, nr) {
    var b = t.el.querySelector('[data-go="' + nr + '"]');
    if (b) b.click();
  }

  // ── 7) Links in deinen Seiten anpassen ─────────────────────────────────────
  // • Modul-Menü ☰: Ein Eintrag mit der Zahl N öffnet das N-te Modul dieses
  //   Pakets, ein Eintrag ohne Zahl (z. B. „Zur Kursübersicht“) die Übersicht.
  //   Bei einem Paket mit nur einem Modul führen die Links wie bisher zu Moodle.
  // • Andere Internet-Links öffnen sich in einem neuen Fenster, damit das
  //   Lernpaket offen bleibt.
  function linksVorbereiten() {
    MODULE.forEach(function (m) {
      Array.prototype.forEach.call(m.el.querySelectorAll('a[href]'), function (a) {
        var href = a.getAttribute('href') || '';
        var imMenue = !!a.closest('[data-modulmenu]');
        if (imMenue && !EINZEL) {
          var zahl = (a.textContent.match(/\d+/) || [])[0];
          var ziel = zahl ? parseInt(zahl, 10) - 1 : -1;
          if (zahl && !MODULE[ziel]) { a.classList.add('nicht-im-paket'); a.title = T('nichtImPaket'); }
          a.addEventListener('click', function (ev) {
            ev.preventDefault();
            menueSchliessen(a);
            if (zahl) { if (MODULE[ziel]) modulZeigen(ziel); }
            else uebersichtZeigen();
          });
        } else if (/^https?:/i.test(href)) {
          a.target = imMenue ? '_top' : '_blank';
          if (!imMenue) a.rel = 'noopener';
        } else if (imMenue && !/^#/.test(href)) {
          a.classList.add('nicht-im-paket');      // Platzhalter wie [✎ Link Modul 2]
          a.addEventListener('click', function (ev) { ev.preventDefault(); });
        }
      });
    });
  }
  function menueSchliessen(a) {
    var menue = a.closest('[data-modulmenu]');
    if (menue) menue.style.display = 'none';
    var wrap = a.closest('[data-menu-wrap]');
    var knopf = wrap && wrap.querySelector('[data-menu-btn]');
    if (knopf) knopf.setAttribute('aria-expanded', 'false');
  }

  // ── 8) Ansicht: Kursübersicht ──────────────────────────────────────────────
  function uebersichtZeigen() {
    vorlesenStopp();
    if (LAUF && !LAUF.fertig) {            // mitten im Abschlusstest
      if (!window.confirm(T('testAbbrechenFrage'))) return;
      testAuswerten(true);
    }
    aktuell = -1;
    MODULE.forEach(function (m) { m.el.hidden = true; });
    $('modulFuss').hidden = true;
    ansichtModul(false);
    var st = zaehlen();
    var html, fort, zumTest;
    if (SEITENLEISTE_AN) {
      var dash = dashboardHtml(st);
      html = dash.html; fort = dash.fort; zumTest = dash.zumTest;
    } else {
      // Kursbild (Einstellung „kursBild“) als Hintergrund des Kopfbereichs
      var kopfStil = EIN.kursBild ? ' style="background:linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,.65)),url(\'' + cssUrl(EIN.kursBild) + '\') center/cover no-repeat;"' : '';
      html = '<div class="uebersicht"><div class="ue-kopf"' + kopfStil + '>' +
        (EIN.kategorie ? '<div class="ue-kategorie">' + esc(EIN.kategorie) + '</div>' : '') +
        '<h1 class="ue-titel">' + esc(EIN.kursTitel) + '</h1>' +
        (EIN.einleitung ? '<p class="ue-text">' + esc(EIN.einleitung) + '</p>' : '') +
        '</div><div class="ue-rahmen"><div class="ue-karte">';
      if (st.fertig) {
        html += '<div class="fertig-meldung">' + T(TEST ? 'kursFertigTest' : FRAGEN_NOETIG && st.fragen ? 'kursFertigFragen' : 'kursFertig') +
          (EIN.zertifikat ? ' <button type="button" class="knopf knopf-zweit" id="knopfZertifikat">' + T('knopfZertifikat') + '</button>' : '') + '</div>';
      }
      html += '<div class="ue-zeile"><div class="ue-stand"><div class="balken"><span style="width:' + st.prozent + '%"></span></div>' + T('stand', st) +
        (FRAGEN_NOETIG && st.fragen ? '<br>' + T('fragenStand', st) : '') + '</div>';
      var ts = TEST ? testStand() : null;
      fort = fortsetzenZiel();
      zumTest = !!ts && st.seitenFertig && !ts.ok && !ts.aufgebraucht;   // Module fertig → der große Knopf führt zum Test
      html += '<button type="button" class="knopf" id="knopfStart">' +
        (zumTest ? T('knopfZumTest') : fort ? T('knopfFortsetzen', { nr: fort.i + 1, seite: fort.seite }) : T('knopfStart')) + '</button></div>';
      if (PUNKTE_AN) {
        var eb = handlungssicherheit(), abz = BADGES.filter(function (b) { return S.b && S.b[b.id]; });
        html += '<div class="einsatz-box"><div class="einsatz-kopf"><span>' + T('einsatzTitel') + '</span><span>' + eb.prozent + ' % · 🏅 ' + (S.p || 0) + '</span></div>' +
          '<div class="einsatz-balken"><span style="width:' + eb.prozent + '%;background:' + eb.farbe + '"></span></div>' +
          '<div class="einsatz-hinweis">' + T('einsatzHinweis') + '</div></div>';

          (m.dauer ? ' · ' + T('dauer', { dauer: m.dauer }) : '') + '</span>' +
          '<span class="balken" style="display:block"><span style="width:' + Math.floor(ms.gesehen / ms.seiten * 100) + '%"></span></span></span></button>';
      });

        var w = { anzahl: TEST.anzahl, bestehen: TEST.bestehen, prozent: ts.bestes, rest: ts.rest };
        var tStatus = ts.ok ? T('testBestanden', w) : ts.zu ? T('testGesperrt') : !ts.versuche ? T('testNeu', w)
          : T('testNichtBestanden', w) + (TEST.versuche ? (ts.rest ? T('testRest', w) : T('testKeineVersuche')) : '');
        html += '<button type="button" class="modul-karte test-karte' + (ts.zu ? ' gesperrt' : ts.ok ? ' bestanden' : ' offen') + '" data-test="1"' + (ts.zu ? ' aria-disabled="true"' : '') + '>' +
          '<span class="modul-nr">' + (ts.zu ? '🔒' : ts.ok ? '✓' : '🏁') + '</span>' +
          '<span class="modul-info"><span class="modul-name">' + esc(TEST.titel) + '</span><br><span class="modul-status">' + tStatus + '</span></span></button>';

    }
    var ue = $('uebersicht');
    ue.innerHTML = html;

      b.addEventListener('click', function () { modulZeigen(Number(b.getAttribute('data-oeffne'))); });
    });
    if ($('knopfZertifikat')) $('knopfZertifikat').addEventListener('click', zertifikatZeigen);
    var tk = ue.querySelector('[data-test]');
    if (tk) tk.addEventListener('click', testZeigen);
    $('knopfStart').addEventListener('click', function () {
      if (zumTest) testZeigen();
      else if (fort) modulZeigen(fort.i, fort.k, fort.nr); else modulZeigen(0);
    });
    anzeigeAktualisieren();
    nachOben();
  }
  // Wo hat man zuletzt aufgehört? Ergebnis: Modul i, Teil k, Schritt nr,
  // und „seite“ = laufende Seitennummer im Modul (über alle Teile gezählt)
  function fortsetzenZiel() {
    if (!S.l) return null;
    var stelle = S.l.split(':');
    for (var i = 0; i < MODULE.length; i++) {
      var davor = 0;
      for (var k = 0; k < MODULE[i].teile.length; k++) {
        var t = MODULE[i].teile[k], pos = t.seiten.indexOf(stelle[1]);
        if (t.id === stelle[0] && pos >= 0) return { i: i, k: k, nr: stelle[1], seite: davor + pos + 1 };
        davor += t.seiten.length;
      }
    }
    return null;
  }

  // ── 9) Ansicht: ein Modul ──────────────────────────────────────────────────
  // Modul i öffnen, darin Teil k (Standard: erster Teil), optional bei Schritt „seite“
  function modulZeigen(i, k, seite) {
    if (!MODULE[i]) return;
    vorlesenStopp();
    if (gesperrt(i) && !seite) {   // Fortsetzen an einer gespeicherten Stelle ist immer erlaubt
      hinweis('warnung', T('hinweisGesperrt', { vorher: i }));
      if (aktuell < 0) uebersichtZeigen();
      nachOben();
      return;
    }
    var m = MODULE[i];
    aktuell = i;
    teilNr = Math.max(0, Math.min(m.teile.length - 1, k || 0));
    $('uebersicht').hidden = true;
    MODULE.forEach(function (x, n) { x.el.hidden = n !== i; });
    if (m.teile.length > 1) m.teile.forEach(function (t, n) { t.el.hidden = n !== teilNr; });
    $('modulFuss').hidden = false;
    ansichtModul(true);
    if (seite) zuSeite(m.teile[teilNr], seite);
    nachOben();
    aktivenSchrittZeigen(m.teile[teilNr].el);
    pruefen();
  }
  // Pflichtfragen: Vorwärts geht es erst, wenn alle Pflichtfragen der offenen Seite gelöst sind
  function vorwaerts() {
    if (!window.FRAGEN || aktuell < 0) return true;
    var o = window.FRAGEN.offen(MODULE[aktuell].teile[teilNr].el);
    if (o) { window.FRAGEN.erinnern(o); return false; }
    return true;
  }
  // Nächster bzw. voriger Schritt in der Reihenfolge Teil → Modul
  function weiter() {
    if (!vorwaerts()) return;
    var m = MODULE[aktuell];
    if (teilNr < m.teile.length - 1) modulZeigen(aktuell, teilNr + 1);
    else if (aktuell < MODULE.length - 1) modulZeigen(aktuell + 1);
  }
  function zurueck() {
    if (teilNr > 0) modulZeigen(aktuell, teilNr - 1);
    else if (aktuell > 0) modulZeigen(aktuell - 1, MODULE[aktuell - 1].teile.length - 1);
  }

  // Leiste und Fußleiste auf den aktuellen Stand bringen
  function anzeigeAktualisieren() {
    var st = zaehlen();
    $('leisteBalken').style.width = st.prozent + '%';
    $('leisteProzent').textContent = st.prozent + ' %';
    if (PUNKTE_AN) { $('leistePunkte').hidden = false; $('leistePunkteZahl').textContent = S.p || 0; }
    seitenleisteAktualisieren();
    leisteText($('knopfUebersicht'), T('knopfUebersicht'));
    $('knopfUebersicht').hidden = EINZEL;
    var m = MODULE[aktuell];
    $('knopfZurueck').hidden = $('knopfWeiter').hidden = EINZEL && MODULE[0].teile.length < 2;
    $('knopfZurueck').disabled = aktuell < 0 || (aktuell === 0 && teilNr === 0);
    $('knopfWeiter').disabled = aktuell < 0 || (aktuell === MODULE.length - 1 && teilNr >= m.teile.length - 1);
    $('leisteTitel').textContent = m ? (EINZEL ? m.titel : EIN.kursTitel + ' · ' + m.titel) : EIN.kursTitel;
    document.title = m ? m.titel : EIN.kursTitel;
    if (!m) return;
    var ms = modulStand(m), t = m.teile[teilNr], mehrteilig = m.teile.length > 1;
    var w = { nr: aktuell + 1, anzahl: MODULE.length, gesehen: ms.gesehen, seiten: ms.seiten, teil: teilNr + 1, teile: m.teile.length };
    w.teilinfo = mehrteilig ? T('fussTeil', w) : '';
    var fuss = $('modulFuss');
    fuss.innerHTML = '<div class="fuss-info">' + T('fussInfo', w) +
      (ms.fertig ? T('fussFertig') : (t.mitSchritten && !teilStand(t).fertig ? '<br>' + T('fussHinweis') : '')) + '</div>';

    // Knöpfe: voriger Teil / voriges Modul / Übersicht / nächster Teil bzw. nächstes Modul
    var letzterTeil = teilNr >= m.teile.length - 1;
    var html = '';
    if (mehrteilig && teilNr > 0) html += '<button type="button" class="knopf knopf-zweit" data-f="teilzurueck">' + T('knopfVorigerTeil') + '</button>';
    if (!EINZEL) {
      html += '<button type="button" class="knopf knopf-zweit" data-f="zurueck"' + (aktuell <= 0 ? ' disabled' : '') + '>' + T('knopfVoriges') + '</button>' +
        '<button type="button" class="knopf knopf-zweit" data-f="uebersicht">' + T('knopfZurUebersicht') + '</button>';
    }
    if (!letzterTeil) html += '<button type="button" class="knopf" data-f="teilweiter">' + T('knopfNaechsterTeil') + '</button>';
    else if (!EINZEL && aktuell < MODULE.length - 1) html += '<button type="button" class="knopf" data-f="weiter">' + T('knopfNaechstes') + '</button>';
    if (html) {
      var k = document.createElement('div');
      k.className = 'fuss-knoepfe';
      k.innerHTML = html;
      k.addEventListener('click', function (ev) {
        var f = ev.target.getAttribute('data-f');
        if (f === 'teilzurueck') modulZeigen(aktuell, teilNr - 1);
        if (f === 'teilweiter' && vorwaerts()) modulZeigen(aktuell, teilNr + 1);
        if (f === 'zurueck') modulZeigen(aktuell - 1);
        if (f === 'weiter' && vorwaerts()) modulZeigen(aktuell + 1);
        if (f === 'uebersicht') uebersichtZeigen();
      });
      fuss.appendChild(k);
    }
  }

  // ── Teilnahmebestätigung zum Drucken (Einstellung „zertifikat“) ─────────────

    if (name.indexOf(',') > 0) { var t = name.split(','); name = (t[1] || '').trim() + ' ' + t[0].trim(); }   // „Nachname, Vorname“ → „Vorname Nachname“

  // ── Vorlesen (Einstellung „vorlesen“) ──────────────────────────────────────
  // Nutzt die Sprachausgabe des Computers (speechSynthesis). Unter Windows gibt es deutsche
  // Stimmen ohne Internet. Gelesen wird nur, was gerade zu sehen ist – ohne Knöpfe.
  var SPRACHE = window.speechSynthesis || null, liestVor = false;
  function vorleseText() {
    var bereich = $('uebersicht');
    if (aktuell >= 0) {
      var t = MODULE[aktuell].teile[teilNr]; bereich = t.el;
      if (t.mitSchritten) { var p = Array.prototype.filter.call(t.el.querySelectorAll('[data-panel]'), sichtbar)[0]; if (p) bereich = p; }
    }
    var teile = [], gang = document.createTreeWalker(bereich, NodeFilter.SHOW_TEXT, null), n, letzter = null;
    while ((n = gang.nextNode())) {
      var el = n.parentNode, text = n.nodeValue.replace(/\s+/g, ' ').trim();
      if (!text || el.closest('button,script,style,[aria-hidden="true"],.fe-knoepfe,.fe-hinweis,[data-modulmenu]') || !sichtbar(el)) continue;
      var block = el.closest('p,li,h1,h2,h3,h4,td,th,dt,dd,figcaption,summary,div');
      if (letzter && block !== letzter && !/[.!?:;]$/.test(teile[teilNr2(teile)])) teile.push('.');
      teile.push(text); letzter = block;
    }
    return teile.join(' ').replace(/\s+\./g, '.').replace(/\.\.+/g, '.');
  }
  function teilNr2(a) { return a.length - 1; }
  function vorlesenStopp() {
    if (!SPRACHE) return;
    liestVor = false; SPRACHE.cancel();
    var k = $('knopfVorlesen'); if (k) { leisteText(k, T('knopfVorlesen')); k.setAttribute('aria-pressed', 'false'); }
  }
  function vorlesen() {
    if (!SPRACHE) return;
    if (liestVor) { vorlesenStopp(); return; }
    var text = vorleseText(); if (!text) return;
    var stimmen = SPRACHE.getVoices().filter(function (v) { return /^de/i.test(v.lang); });
    var stimme = stimmen.filter(function (v) { return v.localService; })[0] || stimmen[0] || null;
    var saetze = text.match(/[^.!?]+[.!?]*/g) || [text];
    SPRACHE.cancel(); liestVor = true;
    var k = $('knopfVorlesen'); leisteText(k, T('knopfVorlesenStopp')); k.setAttribute('aria-pressed', 'true');
    saetze.forEach(function (s, i) {
      var u = new SpeechSynthesisUtterance(s.trim()); u.lang = 'de-DE'; if (stimme) u.voice = stimme;
      if (i === saetze.length - 1) u.onend = function () { if (liestVor) vorlesenStopp(); };
      SPRACHE.speak(u);
    });
  }

  // ── Abschlusstest (Einstellung „test“) ─────────────────────────────────────
  // Startseite → Fragen nacheinander („Antwort abgeben“, dann „Nächste Frage“) → Auswertung.
  // Ein Versuch zählt, sobald er gestartet wird. Die Fragen sieht die Fragen-Engine im
  // Modus „verdeckt“ (Antwort wird nur gespeichert) bzw. mit Rückmeldung, wenn „sofort“ eingestellt ist.
  var LAUF = null;   // laufender Versuch: { nr, fragen: [{ el, richtig, beantwortet }], versuch, fertig }
  // Zeitlimit des Tests (TEST.zeitlimit in Minuten, 0 = kein Limit): Ablaufzeitpunkt merken,
  // jede Sekunde die Anzeige aktualisieren, bei Ablauf automatisch abgeben.
  var ZEITLIMIT_TIMER = null, ZEITLIMIT_ABLAUF = 0;
  function zeitlimitStarten() {
    zeitlimitStoppen();
    if (!TEST.zeitlimit) return;
    ZEITLIMIT_ABLAUF = Date.now() + TEST.zeitlimit * 60000;
    ZEITLIMIT_TIMER = setInterval(zeitlimitPruefen, 1000);
  }
  function zeitlimitStoppen() { if (ZEITLIMIT_TIMER) { clearInterval(ZEITLIMIT_TIMER); ZEITLIMIT_TIMER = null; } }
  function zeitlimitText(ms) {
    var s = Math.ceil(ms / 1000), m = Math.floor(s / 60); s = s % 60;
    return m + ':' + (s < 10 ? '0' : '') + s;
  }
  function zeitlimitPruefen() {
    var anzeige = $('testZeit');
    if (!anzeige) { zeitlimitStoppen(); return; }
    var rest = Math.max(0, ZEITLIMIT_ABLAUF - Date.now());
    anzeige.textContent = T('testZeitUebrig', { zeit: zeitlimitText(rest) });
    anzeige.classList.toggle('knapp', rest > 0 && rest < 60000);
    if (rest <= 0) { zeitlimitStoppen(); hinweis('warnung', T('testZeitAbgelaufen')); testAuswerten(); }
  }
  function testRahmen(innen, kopf) {
    aktuell = -2;
    MODULE.forEach(function (m) { m.el.hidden = true; });
    $('modulFuss').hidden = true;
    ansichtModul(false);
    var ue = $('uebersicht');
    ue.innerHTML = '<div class="uebersicht"><div class="ue-kopf"><div class="ue-kategorie">' + T('testKategorie') + '</div>' +
      '<h1 class="ue-titel">' + esc(TEST.titel) + '</h1>' + (kopf || '') + '</div><div class="ue-rahmen"><div class="ue-karte">' + innen + '</div></div></div>';
    ue.hidden = false;
    anzeigeAktualisieren();
    nachOben();
    return ue;
  }
  function testZeigen() {
    if (!TEST) return;
    var ts = testStand();
    if (ts.zu) { hinweis('warnung', T('testGesperrtHinweis')); return; }
    var w = { anzahl: TEST.anzahl, bestehen: TEST.bestehen, nr: ts.versuche + 1, versuche: TEST.versuche, prozent: ts.bestes };
    var fakten = '<div class="test-fakten"><span>' + T('testFaktFragen', w) + '</span><span>' + T('testFaktBestehen', w) + '</span><span>' +
      (TEST.versuche ? T('testFaktVersuch', { nr: Math.min(w.nr, TEST.versuche), versuche: TEST.versuche }) : T('testFaktFrei')) + '</span><span>' + T(TEST.sofort ? 'testFaktSofort' : 'testFaktEnde') + '</span>' +
      (TEST.zeitlimit ? '<span>' + T('testFaktZeit', { min: TEST.zeitlimit }) + '</span>' : '') + '</div>';
    var html = (TEST.einleitung ? '<p class="test-text">' + esc(TEST.einleitung) + '</p>' : '') + fakten;
    if (ts.ok) html += '<div class="fertig-meldung">' + T('testSchonBestanden', w) + '</div>';
    else if (ts.aufgebraucht) html += '<div class="hinweis hinweis-warnung" style="margin:0">' + T('testAufgebraucht') + '</div>';
    else html += '<p class="test-text" style="font-size:14px">' + T('testHinweis') + '</p>';
    html += '<div class="test-knoepfe"><button type="button" class="knopf knopf-zweit" id="testZurueck">' + T('knopfZurUebersicht') + '</button>' +
      (!ts.ok && !ts.aufgebraucht ? '<button type="button" class="knopf" id="testLos">' + T(ts.versuche ? 'testNochmal' : 'testStarten') + '</button>' : '') + '</div>';
    testRahmen(html);
    $('testZurueck').onclick = uebersichtZeigen;
    if ($('testLos')) { $('testLos').onclick = testStarten; $('testLos').focus(); }
  }
  function testStarten() {
    var reihe = TEST.quellen.map(function (q, i) { return i; });
    for (var i = reihe.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), x = reihe[i]; reihe[i] = reihe[j]; reihe[j] = x; }
    S.t = S.t || { v: 0, b: 0, ok: 0 };
    S.t.v++;
    LAUF = { nr: 0, versuch: S.t.v, fertig: false, fragen: reihe.slice(0, TEST.anzahl).map(function (i) { return { el: TEST.quellen[i].cloneNode(true), richtig: false, beantwortet: false }; }) };
    speichern();
    zeitlimitStarten();
    testFrage();
  }
  function testFrage() {
    var x = LAUF.fragen[LAUF.nr], n = LAUF.fragen.length, letzte = LAUF.nr === n - 1;
    testRahmen('<div class="test-frage" id="testFrage"></div><div class="test-knoepfe">' +
      '<button type="button" class="knopf knopf-zweit" id="testAbbruch">' + T('testAbbrechen') + '</button>' +
      '<button type="button" class="knopf" id="testWeiter" disabled>' + T(letzte ? 'testAuswerten' : 'testWeiter') + '</button></div>',
      '<div class="test-kopfzeile">' + T('testFrageNr', { nr: LAUF.nr + 1, anzahl: n }) + (TEST.zeitlimit ? ' <span id="testZeit" class="test-zeit"></span>' : '') + '</div><div class="balken" style="max-width:420px"><span style="width:' + Math.round(LAUF.nr / n * 100) + '%"></span></div>');
    $('testFrage').appendChild(x.el);
    if (TEST.zeitlimit) zeitlimitPruefen();
    var beginn = Date.now();
    window.FRAGEN.einzeln(x.el, {
      einmal: true, verdeckt: !TEST.sofort, loesungZeigen: true, knopfText: T('testAbgeben'),
      onErgebnis: function (richtig, ctrl) {
        x.beantwortet = true; x.richtig = !!richtig;
        interaktion('test' + LAUF.versuch + '_' + x.el.getAttribute('data-frage'), ctrl, !!richtig, beginn);
        $('testWeiter').disabled = false;
        try { $('testWeiter').focus({ preventScroll: true }); } catch (e) {}
      }
    });
    $('testWeiter').onclick = function () { if (letzte) testAuswerten(); else { LAUF.nr++; testFrage(); } };
    $('testAbbruch').onclick = function () { if (window.confirm(T('testAbbrechenFrage'))) testAuswerten(); };
  }
  // still = ohne Ergebnisseite (z. B. beim Verlassen mitten im Test)
  function testAuswerten(still) {
    zeitlimitStoppen();
    if (!LAUF || LAUF.fertig) return;
    LAUF.fertig = true;
    var n = LAUF.fragen.length, r = 0;
    LAUF.fragen.forEach(function (x) { if (x.richtig) r++; });
    var prozent = n ? Math.floor(r / n * 100) : 0, ok = r * 100 >= TEST.bestehen * n;
    if (prozent > S.t.b) S.t.b = prozent;
    var testNeuBestanden = ok && !S.t.ok;
    if (ok) S.t.ok = 1;
    if (testNeuBestanden) punkteHinzu(50);
    abzeichenPruefen();
    speichern();
    if (still) return;
    var ts = testStand(), w = { richtig: r, anzahl: n, bestehen: TEST.bestehen, prozent: prozent, rest: ts.rest };
    var wiederholIdx = !ok && TEST.wiederholungModul ? modulIndexVon(TEST.wiederholungModul) : -1;
    var html = '<div class="test-ergebnis ' + (ok ? 'ok' : 'nok') + '"><div class="test-prozent">' + prozent + ' %</div>' +
      '<div class="test-urteil">' + T(ok ? 'testUrteilOk' : 'testUrteilNok') + '</div><div>' + T('testErgebnis', w) +
      (!ok && TEST.versuche ? (ts.rest ? T('testRest', w) : T('testKeineVersuche')) : '') + '</div>' +
      (wiederholIdx >= 0 ? '<div class="hinweis" style="margin-top:14px;">' + T('testWiederholungHinweis', { modul: esc(MODULE[wiederholIdx].titel) }) +
        '<button type="button" class="knopf knopf-zweit" id="testWiederholung" style="margin-top:8px;display:block;">' + T('testWiederholungKnopf', { modul: esc(MODULE[wiederholIdx].titel) }) + '</button></div>' : '') +
      '</div>';
    html += '<p style="margin:18px 0 0;font-weight:700">' + T('testDeineAntworten') + '</p><ul class="test-liste">' + LAUF.fragen.map(function (x) {
      var ft = x.el.querySelector('[data-ft]'), text = (ft ? ft.textContent : '').replace(/\s+/g, ' ').trim();
      if (!text) { var lt = x.el.querySelector('[data-lt]'); text = lt ? lt.textContent.replace(/\s+/g, ' ').trim() : ''; }
      if (text.length > 140) text = text.slice(0, 137) + ' …';
      return '<li class="' + (x.richtig ? 'ok' : 'nok') + '"><span class="z">' + (x.richtig ? '✓' : '✗') + '</span><span>' + esc(text || '…') + '</span></li>';
    }).join('') + '</ul>';
    var fertig = zaehlen().fertig;
    html += '<div class="test-knoepfe"><button type="button" class="knopf knopf-zweit" id="testZurueck">' + T('knopfZurUebersicht') + '</button>' +
      (fertig && EIN.zertifikat ? '<button type="button" class="knopf knopf-zweit" id="testZert">' + T('knopfZertifikat') + '</button>' : '') +
      (!ok && !ts.aufgebraucht ? '<button type="button" class="knopf" id="testLos">' + T('testNochmal') + '</button>' : '') + '</div>';
    testRahmen(html);
    $('testZurueck').onclick = uebersichtZeigen;
    if ($('testZert')) $('testZert').onclick = zertifikatZeigen;
    if ($('testLos')) $('testLos').onclick = testStarten;
    if ($('testWiederholung')) $('testWiederholung').onclick = function () { modulZeigen(wiederholIdx); };
  }

  function hinweis(art, html) {
    var box = $('hinweise');
    if (box.innerHTML.indexOf(html) >= 0) return;
    var d = document.createElement('div');
    d.className = 'hinweis' + (art === 'warnung' ? ' hinweis-warnung' : '');
    d.innerHTML = html;
    box.appendChild(d);
  }

  // ── 10) Start ──────────────────────────────────────────────────────────────
  $('knopfUebersicht').addEventListener('click', uebersichtZeigen);
  // Pfeile in der Leiste: zum vorigen/nächsten Teil, am Ende eines Moduls zum vorigen/nächsten Modul
  $('knopfZurueck').addEventListener('click', function () { if (aktuell >= 0) zurueck(); });
  $('knopfWeiter').addEventListener('click', function () { if (aktuell >= 0) weiter(); });

  SCORM.verbinden();
  laden();
  abzeichenPruefen();
  seitenleisteAufbauen();
  if (SPRACHE && EIN.vorlesen !== false) {
    $('knopfVorlesen').hidden = false;
    leisteText($('knopfVorlesen'), T('knopfVorlesen'));
    $('knopfVorlesen').title = T('vorlesenTitel');
    $('knopfVorlesen').onclick = vorlesen;
  }
  if (!SCORM.verbunden) hinweis('', T('vorschau'));
  if (SCORM.nurAnsehen && zaehlen().prozent < ABSCHLUSS) hinweis('warnung', T('ansichtsmodus'));
  if (!MODULE.length && !TEST) { hinweis('warnung', T('keineModule')); anzeigeAktualisieren(); return; }
  linksVorbereiten();
  // Fragen auf den Kursseiten bedienbar machen (falls die Fragen-Engine enthalten ist)
  if (window.FRAGEN) {
    // Ergebnis jeder Frage an Moodle melden – je Frage nur der erste Versuch pro Sitzung
    var gemeldet = {};
    window.FRAGEN.starten($('module'), {
      geloest: S.f, onGeloest: function (id) { if (!S.f[id]) { punkteHinzu(10); abzeichenPruefen(); } S.f[id] = 1; speichern(); },
      onAntwort: function (id, richtig, ctrl) { if (gemeldet[id]) return; gemeldet[id] = 1; interaktion('seite_' + id, ctrl, richtig); }
    });
    window.FRAGEN.sperreAnbinden($('module'));
  }
  // Schritt gewechselt (Knöpfe der Seite: Weiter, Zurück, Schrittnummern) → an den Anfang der Seite springen.
  // Ist das Blättern wegen einer offenen Pflichtfrage gesperrt, kommt der Klick hier gar nicht an.
  $('module').addEventListener('click', function (ev) {
    var b = ev.target.closest && ev.target.closest('[data-go]');
    if (!b || aktuell < 0 || !MODULE[aktuell]) return;
    var t = MODULE[aktuell].teile[teilNr];
    setTimeout(function () { nachOben(t && t.oben); if (t) aktivenSchrittZeigen(t.el); }, 0);   // erst nachdem die Seite den Schritt gewechselt hat
  });
  // Bilder in Seiten vergrößerbar machen (Lupe) – abschaltbar über die Kurs-Einstellungen
  if (BILD_LUPE_AN) { document.documentElement.classList.add('lupe-an'); lupeAnbinden($('module')); }
  // Fallszenarien (Baustein): gegangener Weg und Ende an Moodle melden
  $('module').addEventListener('lm-szenario', function (ev) {
    var d = ev.detail || {}, name = 'szenario_' + String(d.titel || 'ohne_titel').toLowerCase().replace(/[^a-z0-9]+/g, '_').slice(0, 60);
    interaktion(name, { typ: 'szenario', el: ev.target, antwort: function () { return (d.weg || []).join(' → ') + ' → Ende (' + d.ende + ')'; } },
      d.ende === 'gut' ? true : d.ende === 'schlecht' ? false : null);
    if (PUNKTE_AN) {
      S.s = S.s || {};
      if (!S.s[name]) punkteHinzu(d.ende === 'gut' ? 15 : d.ende === 'neutral' ? 5 : 0);
      S.s[name] = d.ende;
      abzeichenPruefen(); speichern();
    }
  });
  // Software-Simulation (Baustein): Ergebnis melden – im Modus „zeigen" wird nichts bewertet, nur zugeschaut
  $('module').addEventListener('lm-simulation', function (ev) {
    var d = ev.detail || {}, name = 'simulation_' + String(d.titel || 'ohne_titel').toLowerCase().replace(/[^a-z0-9]+/g, '_').slice(0, 60);
    interaktion(name, { typ: 'simulation', el: ev.target, antwort: function () { return d.bestanden ? 'bestanden' : 'nicht bestanden'; } }, d.modus === 'zeigen' ? null : !!d.bestanden);
    if (PUNKTE_AN && d.modus !== 'zeigen') {
      S.sim = S.sim || {};
      if (!S.sim[name] && d.bestanden) punkteHinzu(10);
      S.sim[name] = !!d.bestanden;
      abzeichenPruefen(); speichern();
    }
  });

  if (TEST && EIN.direktZumTest) {
    testZeigen();
  } else if (EINZEL) {
    var f = fortsetzenZiel();
    if (f) modulZeigen(0, f.k, f.nr); else modulZeigen(0);
  } else {
    uebersichtZeigen();
  }

  window.addEventListener('pagehide', function () { positionMerken(); SCORM.beenden(); });
  window.addEventListener('beforeunload', function () { positionMerken(); SCORM.beenden(); });
})();
</script>
</body>
</html>
